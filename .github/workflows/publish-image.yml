name: publish-image

on:
  push:
    branches: [main]
    tags: ["v*", "*-r*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: paperboatlab/squero-julia-kernel
  KERNEL_TAG: 1.11.6-r3

jobs:
  publish:
    name: Publish kernel image to GHCR
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: squero-julia-kernel
      - uses: actions/checkout@v4
        with:
          repository: paperboatlab/squero-mx-base
          path: SqueroBase.jl
      - uses: actions/checkout@v4
        with:
          repository: paperboatlab/SqueroPlot.jl
          path: SqueroPlot.jl
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        shell: bash
        run: |
          tags="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.KERNEL_TAG }}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ref_tag="${GITHUB_REF#refs/tags/}"
            tags="${tags},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${ref_tag}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: squero-julia-kernel/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true
      - name: Print pinned digest
        run: |
          echo "Published ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
          echo "### Kernel image" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
